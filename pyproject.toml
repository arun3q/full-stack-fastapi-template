[dependency-groups]
dev = [
    "prek>=0.4.8,<1.0.0",
    "zizmor>=1.25.2",
]

github-actions = [
    "smokeshow >=0.5.0",
]

[tool.mypy]
# pre-commit runs `mypy backend/app` from the repository root, so the config
# for untyped third-party libraries lives here.
[[tool.mypy.overrides]]
module = ["authlib.*", "razorpay", "razorpay.*"]
ignore_missing_imports = true

[tool.uv.workspace]
members = ["backend"]

[tool.typos.files]
extend-exclude = [
    "img/",
    "uv.lock",
    "bun.lock",
    "backend/coverage/",
    "backend/htmlcov/",
    "backend/app/frontend/",
    "frontend/dist/",
    "frontend/public/assets/images/",
]

[tool.typos.default]
extend-ignore-re = [
    # GitHub usernames in @mentions
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
    # Name of the package in the PR title
    "Bump certifi ",
]

[tool.typos.default.extend-identifiers]
alls = "alls"
