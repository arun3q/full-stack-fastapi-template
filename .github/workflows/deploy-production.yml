name: Deploy to Production

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  deploy:
    environment: production
    # Do not deploy in the main repository, only in user projects
    if: github.repository_owner != 'fastapi'
    runs-on:
      - self-hosted
      - production
    env:
      ENVIRONMENT: production
      DOMAIN: ${{ secrets.DOMAIN_PRODUCTION }}
      FRONTEND_HOST: https://${{ secrets.DOMAIN_PRODUCTION }}
      STACK_NAME: ${{ secrets.STACK_NAME_PRODUCTION }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
      FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAILS_FROM_EMAIL: ${{ secrets.EMAILS_FROM_EMAIL }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build image (tagged with commit SHA)
        env:
          TAG: ${{ github.sha }}
        run: docker compose -f compose.yml -f compose.prod.yml --project-name ${{ secrets.STACK_NAME_PRODUCTION }} build
      - name: Push image (SHA tag)
        env:
          TAG: ${{ github.sha }}
        run: docker compose -f compose.yml -f compose.prod.yml --project-name ${{ secrets.STACK_NAME_PRODUCTION }} push
      - name: Deploy (recreate)
        env:
          TAG: ${{ github.sha }}
        run: docker compose -f compose.yml -f compose.prod.yml --project-name ${{ secrets.STACK_NAME_PRODUCTION }} up -d --force-recreate
      - name: Wait for readiness
        env:
          TAG: ${{ github.sha }}
          STACK_NAME: ${{ secrets.STACK_NAME_PRODUCTION }}
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost/api/v1/utils/ready"; then
              echo "backend ready"
              # Roll the 'latest' tag forward only after a healthy deploy
              docker tag "${DOCKER_IMAGE_BACKEND}:${TAG}" "${DOCKER_IMAGE_BACKEND}:latest"
              docker push "${DOCKER_IMAGE_BACKEND}:latest"
              exit 0
            fi
            sleep 5
          done
          echo "backend did not become ready" >&2
          echo "Rollback: docker compose -f compose.yml -f compose.prod.yml up -d --force-recreate with TAG=<previous-sha>" >&2
          exit 1
